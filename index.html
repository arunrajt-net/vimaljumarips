<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Arun Raj T - ID Card</title>
  <style>
    body {
      background-color: #f0f4f8;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .id-card {
      background-color: #ffffff;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      width: 350px;
      padding: 20px;
      text-align: center;
      color: #333;
    }

    .profile-img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 15px;
      border: 4px solid #4a90e2;
    }

    .name {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .title {
      font-size: 16px;
      color: #555;
      margin-bottom: 10px;
    }

    .info {
      text-align: left;
      margin-top: 10px;
    }

    .info p {
      margin: 6px 0;
    }
  </style>
</head>
<body>
  <div class="id-card">
    <img src="your-image.jpeg" alt="My Photo" width="100">
    <div class="name">Arun Raj T</div>
    <div class="title">Computer Science Engineering Student</div>
    <div class="info">
      <p><strong>College:</strong> Amal Jyothi Engineering College</p>
      <p><strong>Hometown:</strong> Manakadavu, Alakode, Kannur</p>
      <p><strong>Email:</strong> raju833@gmail.com</p>
      <p><strong>Interests:</strong> Robotics, AI, Coding, Football</p>
    </div>
  </div>
</body>
</html>
